# permapath.link: serves the current editor from Arweave. Replaces the legacy
# gateway (legacy/worker), so the name and routes match it.
# Deploy: cd worker && npx wrangler deploy   (needs CLOUDFLARE_API_TOKEN)
name = "permapath-gateway"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Only served on permapath.link (the account needs a workers.dev subdomain for
# Durable Objects, but this Worker doesn't use it).
workers_dev = false

routes = [
  { pattern = "permapath.link/*", zone_name = "permapath.link" },
  { pattern = "permapath.link", zone_name = "permapath.link" }
]

# Scan counts (see ScanCounter in src/index.js): one SQLite-backed Durable Object.
[[durable_objects.bindings]]
name = "SCANS"
class_name = "ScanCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScanCounter"]

# Feature suggestions (see SuggestionBox): private, fetched by goodspeed with
# the SUGGEST_ADMIN_KEY secret (wrangler secret put SUGGEST_ADMIN_KEY).
[[durable_objects.bindings]]
name = "SUGGESTIONS"
class_name = "SuggestionBox"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SuggestionBox"]
